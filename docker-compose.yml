version: "3.8"

services:
  nginx:
    image: nginx:stable-alpine
    container_name: user-management-nginx
    ports:
      - "80:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - user-management-net

  php:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: user-management-php
    environment:
      - XDEBUG_MODE=off
      - XDEBUG_CONFIG=client_host=host.docker.internal client_port=9003 idekey=docker
    volumes:
      - ./:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
    depends_on:
      - redis
      - mysql
    networks:
      - user-management-net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: >
      sh -c "mkdir -p /var/www/html/storage/framework/cache/data /var/www/html/storage/framework/sessions /var/www/html/storage/framework/views /var/www/html/storage/logs /var/www/html/bootstrap/cache && chmod -R 777 /var/www/html/storage /var/www/html/bootstrap/cache && php-fpm"

  php-queue:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: user-management-horizon
    command: php artisan horizon
    volumes:
      - ./:/var/www/html
    depends_on:
      - php
      - redis
      - mysql
    networks:
      - user-management-net
    user: "1000:1000"

  reverb:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: user-management-reverb
    command: php artisan reverb:start --host=0.0.0.0 --port=6001
    ports:
      - "6001:6001"
    volumes:
      - ./:/var/www/html
    depends_on:
      - php
      - redis
      - mysql
    networks:
      - user-management-net
    user: "1000:1000"

  php-pulse:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: user-management-pulse
    command: php artisan pulse:work
    volumes:
      - ./:/var/www/html
    depends_on:
      - php
      - redis
      - mysql
    networks:
      - user-management-net
    user: "1000:1000"

  redis:
    image: redis:alpine
    container_name: user-management-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - user-management-net

  redis-pulse:
    image: redis:alpine
    container_name: user-management-redis-pulse
    ports:
      - "6380:6380"
    volumes:
      - redis_pulse_data:/data
    networks:
      - user-management-net

  mysql:
    image: mysql:8.0
    container_name: mysql-db
    restart: always
    environment:
      MYSQL_DATABASE: user-management
      MYSQL_USER: laravel_user
      MYSQL_PASSWORD: 181724
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - user-management-net
    extra_hosts:
      - "host.docker.internal:host-gateway"

  mysql_testing:
    image: mysql:8.0
    container_name: mysql-db-testing
    restart: always
    environment:
      MYSQL_DATABASE: user_management_testing
      MYSQL_USER: laravel_testing
      MYSQL_PASSWORD: secret_testing
      MYSQL_ROOT_PASSWORD: secret_root_testing
    ports:
      - "3307:3307"
    volumes:
      - mysql_testing_data:/var/lib/mysql
    networks:
      - user-management-net
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  redis_data:
  mysql_data:
  mysql_testing_data:
  redis_pulse_data:

networks:
  user-management-net:
    driver: bridge